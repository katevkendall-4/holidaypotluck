<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kendall Holiday Drop-in Potluck &amp; Book Share</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,SOFT,wght@9..144,100,700&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy: #043474;
      --cobalt: #0277BD;
      --slate: #6F88A6;
      --lavender: #C49CE6;
      --lavender-soft: #F3EAFC;
      --bg: #F3F5F8;
      --card: #FFFFFF;
      --text: #1B2A41;
      --muted: #55657D;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px 16px 48px;
      font-family: 'Open Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      background-image: radial-gradient(#d8e2ee 1px, transparent 1px);
      background-size: 20px 20px;
      color: var(--text);
      line-height: 1.55;
    }

    .container { max-width: 680px; margin: 0 auto; }
    .header { text-align: center; margin-bottom: 16px; }

    .eyebrow {
      display: inline-block;
      background: var(--lavender-soft);
      color: var(--navy);
      border: 1.5px solid var(--lavender);
      font-weight: 700;
      font-size: 0.85rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 5px 14px;
      border-radius: 999px;
    }

    .card {
      background: var(--card);
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 8px 24px rgba(4, 52, 116, 0.08);
      border: 2px solid #E4ECF5;
    }

    .poster-card { padding: 12px; text-align: center; border-color: var(--lavender); }
    .poster-card img { width: 100%; height: auto; border-radius: 12px; display: block; }

    .quick-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 14px;
      padding: 18px 20px;
    }
