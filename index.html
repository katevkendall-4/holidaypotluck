<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kendall Holiday Drop-in Potluck &amp; Book Share</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,SOFT,wght@9..144,100,700&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy: #043474;
      --cobalt: #0277BD;
      --slate: #6F88A6;
      --lavender: #C49CE6;
      --lavender-soft: #F3EAFC;
      --bg: #F3F5F8;
      --card: #FFFFFF;
      --text: #1B2A41;
      --muted: #55657D;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px 16px 48px;
      font-family: 'Open Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      background-image: radial-gradient(#d8e2ee 1px, transparent 1px);
      background-size: 20px 20px;
      color: var(--text);
      line-height: 1.55;
    }

    .container { max-width: 680px; margin: 0 auto; }
    .header { text-align: center; margin-bottom: 16px; }

    .eyebrow {
      display: inline-block;
      background: var(--lavender-soft);
      color: var(--navy);
      border: 1.5px solid var(--lavender);
      font-weight: 700;
      font-size: 0.85rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 5px 14px;
      border-radius: 999px;
    }

    .card {
      background: var(--card);
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 8px 24px rgba(4, 52, 116, 0.08);
      border: 2px solid #E4ECF5;
    }

    .poster-card { padding: 12px; text-align: center; border-color: var(--lavender); }
    .poster-card img { width: 100%; height: auto; border-radius: 12px; display: block; }

    /* Compact Quick Links Card */
    .quick-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 14px;
      padding: 18px 20px;
    }

    .quick-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #F8FAFD;
      border: 1.5px solid #E1E9F4;
      border-radius: 14px;
      padding: 12px 14px;
    }

    .quick-icon { font-size: 1.4rem; flex-shrink: 0; }
    .quick-label { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--slate); }
    .quick-value { font-size: 0.96rem; font-weight: 700; color: var(--navy); }
    .quick-sub { font-size: 0.85rem; color: var(--muted); }

    .clean-link { color: var(--cobalt); text-decoration: none; border-bottom: 1.5px dashed var(--cobalt); }
    .clean-link:hover { color: var(--navy); border-bottom-style: solid; }

    h2 {
      font-family: 'Fraunces', Georgia, serif;
      font-variation-settings: "SOFT" 100, "WONK" 1;
      color: var(--navy);
      font-size: 1.5rem;
      margin: 0 0 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .detail-note { font-size: 0.92rem; color: var(--muted); }

    .guest-summary { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
    .count-pill { font-size: 0.85rem; font-weight: 700; padding: 4px 12px; border-radius: 999px; background: #E8F3FC; color: var(--navy); }
    .count-pill.invited { background: var(--lavender-soft); color: #5A367A; }

    .guest-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
    .guest-item { background: #F8FAFD; border: 1.5px solid #E1E9F4; border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }
    .guest-item.going { background: #F2F9FF; border-color: #B6DCF8; }
    .guest-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .guest-name { font-weight: 700; color: var(--navy); font-size: 0.98rem; }
    .status-badge { font-size: 0.78rem; font-weight: 700; padding: 3px 9px; border-radius: 999px; white-space: nowrap; background: var(--lavender-soft); color: #5A367A; }
    .guest-item.going .status-badge { background: var(--navy); color: #FFFFFF; }
    .guest-dish { font-size: 0.88rem; color: var(--cobalt); font-weight: 600; }
    .loading-text { color: var(--muted); font-style: italic; font-size: 0.95rem; }

    .form-wrapper { width: 100%; overflow: hidden; border-radius: 12px; }
    .form-wrapper iframe { width: 100%; border: none; display: block; }
    .footer { text-align: center; color: var(--slate); font-weight: 700; font-size: 0.95rem; margin-top: 12px; }
  </style>
</head>
