<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kendall Holiday Drop-in Potluck &amp; Book Share</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy: #043474;
      --cobalt: #0277BD;
      --slate: #6F88A6;
      --lavender: #C49CE6;
      --lavender-soft: #F3EAFC;
      --bg: #F3F5F8;
      --card: #FFFFFF;
      --text: #1B2A41;
      --muted: #55657D;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px 16px 48px;
      font-family: 'Nunito', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      background-image: radial-gradient(#d8e2ee 1px, transparent 1px);
      background-size: 20px 20px;
      color: var(--text);
      line-height: 1.55;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .eyebrow {
      display: inline-block;
      background: var(--lavender-soft);
      color: var(--navy);
      border: 1.5px solid var(--lavender);
      font-weight: 700;
      font-size: 0.85rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 5px 14px;
      border-radius: 999px;
      margin-bottom: 10px;
    }

    h1 {
      font-family: 'Fredoka', sans-serif;
      color: var(--navy);
      font-size: clamp(1.9rem, 5vw, 2.5rem);
      margin: 0 0 6px;
      line-height: 1.15;
    }

    .subtitle {
      color: var(--cobalt);
      font-weight: 700;
      font-size: 1.05rem;
      margin: 0;
    }

    .card {
      background: var(--card);
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 8px 24px rgba(4, 52, 116, 0.08);
      border: 2px solid #E4ECF5;
    }

    .poster-card {
      padding: 12px;
      text-align: center;
      border-color: var(--lavender);
    }

    .poster-card img {
      width: 100%;
      height: auto;
      border-radius: 12px;
      display: block;
    }

    h2 {
      font-family: 'Fredoka', sans-serif;
      color: var(--navy);
      font-size: 1.45rem;
      margin: 0 0 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .detail-row {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 12px 0;
      border-bottom: 1px solid #EEF2F7;
    }

    .detail-row:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .detail-icon {
      font-size: 1.45rem;
      line-height: 1.2;
      flex-shrink: 0;
      width: 32px;
      text-align: center;
    }

    .detail-label {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--slate);
    }

    .detail-value {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--navy);
    }

    .detail-note {
      font-size: 0.92rem;
      color: var(--muted);
